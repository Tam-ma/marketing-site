name: Deploy to Cloudflare

# Deploys the marketing site Worker (src/index.ts, configured in wrangler.toml)
# to Cloudflare. Triggered on push to main, or manually with an environment choice.
#
# NOTE: this site is a Cloudflare Worker that serves public/ via [assets] — it is
# NOT a Pages project. Deploy with `wrangler deploy`, not `wrangler pages deploy`.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # wrangler 4 requires Node.js >= 22
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `wrangler deploy` runs the wrangler.toml [build] command, then deploys.
          # --env selects the [env.*] block (production has the real KV namespace id).
          command: deploy --env ${{ github.event.inputs.environment || 'production' }}

      - name: Performance audit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://tamma.dev
          uploadArtifacts: true
          temporaryPublicStorage: true
